[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-sentinel"
version = "1.2.0"
description = "A dependency-free API regression and quality monitoring CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Haoran Tan" }]
keywords = ["api-testing", "qa", "regression-testing", "monitoring", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0,<7"]

[project.urls]
Homepage = "https://github.com/T98765SREDT/qa-sentinel"
Repository = "https://github.com/T98765SREDT/qa-sentinel"
Issues = "https://github.com/T98765SREDT/qa-sentinel/issues"

[project.scripts]
qa-sentinel = "qa_sentinel.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["qa_sentinel*"]
